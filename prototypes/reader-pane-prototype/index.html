<!DOCTYPE html>
<!-- PROTOTYPE — throwaway. Wayfinder ticket #6: what should the reader pane look and behave like?
     Revision 2: single layout (C's shell) with three independent toggles:
       1) details: inline expand vs right side panel
       2) nav: left tree panel vs breadcrumb top links
       3) layout: verse-per-line vs continuous prose (respects paragraph info)
     Mock data only (John 15, public-domain/approximate text). Delete when the ticket resolves. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader Pane Prototype — Scripture Study</title>
<style>
  :root {
    --bg: #1e1e1e; --bg2: #262626; --bg3: #2f2f2f; --border: #3a3a3a;
    --text: #dcddde; --muted: #9a9a9a; --faint: #6e6e6e;
    --accent: #a78bfa; --accent-dim: rgba(167,139,250,.14);
    --highlight: rgba(167,139,250,.10); --highlight-border: #a78bfa;
    --anno: #e0af68; --inter: #7aa2f7;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #app { height: 100vh; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 5px; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--bg3);
    font-size: .85rem; color: var(--muted);
  }
  .chip.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .icon-anno { color: var(--anno); }
  .icon-inter { color: var(--inter); }
  .badge {
    display: inline-block; min-width: 16px; text-align: center; font-size: .7rem;
    border-radius: 8px; padding: 0 4px; background: var(--bg3); color: var(--muted);
  }

  .entry-banner {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px;
    background: var(--accent-dim); border-bottom: 1px solid var(--border);
    font-size: .82rem; color: var(--accent);
  }
  .entry-banner code { background: rgba(0,0,0,.25); padding: 1px 6px; border-radius: 4px; }
  .entry-banner button { margin-left: auto; color: var(--muted); }

  /* toolbar + toggles */
  .toolbar {
    display: flex; align-items: center; gap: 14px; padding: 7px 14px;
    background: var(--bg2); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .toolbar .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button { padding: 3px 10px; font-size: .78rem; color: var(--muted); background: var(--bg3); }
  .seg button.on { background: var(--accent-dim); color: var(--accent); }
  .seg-label { font-size: .68rem; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }

  /* shell */
  .shell { display: flex; flex-direction: column; height: 100%; }
  .main { flex: 1; display: flex; min-height: 0; }

  /* left tree (nav = tree) */
  .tree {
    width: 205px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 10px 0 40px; font-size: .88rem;
  }
  .tree .grp { padding: 4px 14px; color: var(--faint); text-transform: uppercase; font-size: .68rem; letter-spacing: .06em; margin-top: 8px; }
  .tree-book { display: block; width: 100%; text-align: left; padding: 3px 14px; color: var(--muted); }
  .tree-book:hover { color: var(--text); background: var(--bg3); }
  .tree-book.on { color: var(--accent); }
  .tree-chapters { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 14px 8px 22px; }
  .tree-ch { width: 30px; height: 26px; border-radius: 5px; background: var(--bg3); color: var(--muted); font-size: .78rem; }
  .tree-ch.on { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); }

  /* breadcrumb (nav = crumb) */
  .crumb {
    display: flex; align-items: center; gap: 6px; padding: 6px 16px;
    background: var(--bg2); border-bottom: 1px solid var(--border); font-size: .9rem;
  }
  .crumb button.link { color: var(--accent); }
  .crumb .hint { color: var(--faint); font-size: .78rem; }
  .crumb .spacer { flex: 1; }
  .crumb .step { color: var(--muted); padding: 2px 8px; border-radius: 5px; }
  .crumb .step:hover { background: var(--bg3); color: var(--text); }

  /* content */
  .content-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .scroll { flex: 1; overflow-y: auto; padding: 18px 26px 60px; }
  .scroll .inner { max-width: 700px; }
  .scroll h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 14px; }
  .scroll h1 .tid { color: var(--faint); font-size: .85rem; font-weight: 400; }

  /* verse-per-line */
  .v-line { padding: 4px 8px; border-radius: 6px; cursor: pointer; line-height: 1.65; }
  .v-line:hover { background: var(--bg3); }
  .v-line.hl { background: var(--highlight); box-shadow: inset 3px 0 0 var(--highlight-border); border-radius: 0 6px 6px 0; }
  .v-line.sel { background: var(--accent-dim); }
  .v-line .vnum { color: var(--accent); font-size: .75em; font-weight: 700; margin-right: 6px; }
  .v-line .marks { font-size: .7rem; margin-left: 4px; }

  /* continuous prose */
  .prose { font-family: Georgia, "Times New Roman", serif; font-size: 1.06rem; line-height: 1.85; }
  .prose p { margin: 0 0 1em; }
  .v-span { cursor: pointer; border-radius: 3px; padding: 1px 2px; }
  .v-span:hover { background: var(--bg3); }
  .v-span.hl { background: var(--highlight); box-shadow: -3px 0 0 var(--highlight-border); }
  .v-span.sel { background: var(--accent-dim); }
  .v-span sup { color: var(--accent); font-size: .68em; margin-right: 3px; font-family: -apple-system, sans-serif; }
  .v-span .marks { font-size: .62em; vertical-align: super; margin-left: 2px; letter-spacing: 1px; }

  /* inline expand */
  .expand {
    margin: 4px 0 10px 24px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg2); padding: 10px 14px; font-size: .92rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .prose .expand { margin: 6px 0 14px; }
  .expand table { width: 100%; border-collapse: collapse; }
  .expand td { padding: 5px 8px; vertical-align: top; border-top: 1px solid var(--border); }
  .expand td:first-child { color: var(--accent); font-weight: 600; width: 52px; border: none; }
  .expand tr:first-child td { border-top: none; }
  .expand .exp-title { font-size: .78rem; color: var(--faint); margin-bottom: 6px; }

  /* side panel */
  .side {
    flex-shrink: 0; width: 320px; border-left: 1px solid var(--border); background: var(--bg2);
    display: flex; flex-direction: column;
  }
  .side-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .side-tab { flex: 1; padding: 8px; font-size: .85rem; color: var(--muted); border-bottom: 2px solid transparent; }
  .side-tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .side-body { flex: 1; overflow-y: auto; padding: 12px 14px 40px; }

  /* note cards / translations */
  .note-card {
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg3);
    padding: 8px 10px; margin: 8px 0; font-size: .88rem; cursor: pointer;
  }
  .note-card:hover { border-color: var(--accent); }
  .note-card .path { color: var(--faint); font-size: .75rem; margin-bottom: 3px; }
  .note-card.anno { border-left: 3px solid var(--anno); }
  .note-card.inter { border-left: 3px solid var(--inter); }
  .trans-row { margin: 6px 0; }
  .trans-row .tid { color: var(--accent); font-weight: 600; font-size: .8rem; margin-right: 8px; }
  .attrib { color: var(--faint); font-size: .72rem; margin-top: 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- mock data ---------------- */
const TRANSLATIONS = ["WEB", "KJV", "ASV", "BSB"];
const BOOKS_BEFORE = ["Matthew","Mark","Luke"], BOOKS_AFTER = ["Acts","Romans","1 Corinthians","Ephesians","Revelation"];
const CHAPTERS = 21;
const WEB = {
1:"I am the true vine, and my Father is the farmer.",
2:"Every branch in me that doesn’t bear fruit, he takes away. Every branch that bears fruit, he prunes, that it may bear more fruit.",
3:"You are already pruned clean because of the word which I have spoken to you.",
4:"Remain in me, and I in you. As the branch can’t bear fruit by itself unless it remains in the vine, so neither can you, unless you remain in me.",
5:"I am the vine. You are the branches. He who remains in me and I in him bears much fruit, for apart from me you can do nothing.",
6:"If a man doesn’t remain in me, he is thrown out as a branch and is withered; and they gather them, throw them into the fire, and they are burned.",
7:"If you remain in me, and my words remain in you, you will ask whatever you desire, and it will be done for you.",
8:"In this my Father is glorified, that you bear much fruit; and so you will be my disciples.",
9:"Even as the Father has loved me, I also have loved you. Remain in my love.",
10:"If you keep my commandments, you will remain in my love, even as I have kept my Father’s commandments and remain in his love.",
11:"I have spoken these things to you, that my joy may remain in you, and that your joy may be made full.",
12:"This is my commandment, that you love one another, even as I have loved you.",
13:"Greater love has no one than this, that someone lay down his life for his friends.",
14:"You are my friends if you do whatever I command you.",
15:"No longer do I call you servants, for the servant doesn’t know what his lord does. But I have called you friends, for everything that I heard from my Father, I have made known to you.",
16:"You didn’t choose me, but I chose you and appointed you, that you should go and bear fruit, and that your fruit should remain; that whatever you will ask of the Father in my name, he may give it to you.",
17:"I command these things to you, that you may love one another."
};
const KJV = {
1:"I am the true vine, and my Father is the husbandman.",
2:"Every branch in me that beareth not fruit he taketh away: and every branch that beareth fruit, he purgeth it, that it may bring forth more fruit.",
3:"Now ye are clean through the word which I have spoken unto you.",
4:"Abide in me, and I in you. As the branch cannot bear fruit of itself, except it abide in the vine; no more can ye, except ye abide in me.",
5:"I am the vine, ye are the branches: He that abideth in me, and I in him, the same bringeth forth much fruit: for without me ye can do nothing.",
6:"If a man abide not in me, he is cast forth as a branch, and is withered; and men gather them, and cast them into the fire, and they are burned.",
7:"If ye abide in me, and my words abide in you, ye shall ask what ye will, and it shall be done unto you.",
8:"Herein is my Father glorified, that ye bear much fruit; so shall ye be my disciples.",
9:"As the Father hath loved me, so have I loved you: continue ye in my love.",
10:"If ye keep my commandments, ye shall abide in my love; even as I have kept my Father's commandments, and abide in his love.",
11:"These things have I spoken unto you, that my joy might remain in you, and that your joy might be full.",
12:"This is my commandment, That ye love one another, as I have loved you.",
13:"Greater love hath no man than this, that a man lay down his life for his friends.",
14:"Ye are my friends, if ye do whatsoever I command you.",
15:"Henceforth I call you not servants; for the servant knoweth not what his lord doeth: but I have called you friends; for all things that I have heard of my Father I have made known unto you.",
16:"Ye have not chosen me, but I have chosen you, and ordained you, that ye should go and bring forth fruit, and that your fruit should remain: that whatsoever ye shall ask of the Father in my name, he may give it you.",
17:"These things I command you, that ye love one another."
};
const TEXTS = {
  WEB, KJV,
  ASV: Object.fromEntries(Object.entries(KJV).map(([k,v]) => [k, v.replace(/\bye\b/g,"you").replace(/hath/g,"has")])),
  BSB: Object.fromEntries(Object.entries(WEB).map(([k,v]) => [k, v.replace(/farmer/,"keeper of the vineyard")]))
};
const VERSE_COUNT = 17;
// paragraph (pericope) structure — verse numbers that START a paragraph
const PARAGRAPHS = [1, 5, 9, 12, 16];
const HIGHLIGHT = { from: 4, to: 7 };  // opened from {John 15:4-7 web callout}
const NOTES = {
  4: { anno: { path: "Scripture Study/Annotations/John 15.4 — Abide.md",
               excerpt: "“Abide” (μένω) — the whole chapter hangs on this word. Union precedes fruit; effort without connection withers…" },
       inter: [] },
  5: { anno: null,
       inter: [ { path: "Sermons/2025-06-08 Fruitfulness.md", ref: "{John 15:1-8}", excerpt: "Main text for the June series on fruitfulness…" },
                { path: "Topics/Union with Christ.md", ref: "{John 15:4-5 kjv}", excerpt: "Collects passages on union — vine, body, temple…" } ] },
  7: { anno: { path: "Scripture Study/Annotations/John 15.7 — Prayer.md",
               excerpt: "Asking flows out of abiding — the promise is conditioned on both remaining and his words remaining…" },
       inter: [ { path: "Topics/Prayer promises.md", ref: "{John 15:7}", excerpt: "Every 'ask' promise in the gospels, side by side…" } ] },
  13:{ anno: null,
       inter: [ { path: "Topics/Friendship.md", ref: "{John 15:13-15}", excerpt: "From servants to friends — disclosure as intimacy…" } ] },
};
const ATTRIB = { WEB: "World English Bible — public domain", KJV: "King James Version — public domain",
                 ASV: "American Standard Version — public domain (mock text)", BSB: "Berean Standard Bible — free use (mock text)" };

/* ---------------- state ---------------- */
const state = {
  translation: "WEB",
  details: "inline",   // 'inline' | 'side'   — toggle 1
  nav: "tree",         // 'tree' | 'crumb'    — toggle 2
  layout: "line",      // 'line' | 'continuous' — toggle 3
  selected: 4,
  expanded: new Set([4]),
  sideTab: "trans",
  bookOpen: true,
  bannerDismissed: false,
};

/* ---------------- helpers ---------------- */
function verseText(v, t = state.translation) { return (TEXTS[t] && TEXTS[t][v]) || "…"; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function marks(v) {
  const n = NOTES[v]; if (!n) return "";
  let s = "";
  if (n.anno) s += `<span class="icon-anno" title="Annotation">●</span>`;
  if (n.inter.length) s += `<span class="icon-inter" title="${n.inter.length} intersecting note(s)">◆${n.inter.length > 1 ? n.inter.length : ""}</span>`;
  return s;
}
function noteCards(v) {
  const n = NOTES[v]; if (!n || (!n.anno && !n.inter.length))
    return `<div style="color:var(--faint);font-size:.85rem;margin:8px 0;">No annotations or intersecting notes. <span style="color:var(--accent);cursor:pointer;">+ Annotate John 15:${v}</span></div>`;
  let h = "";
  if (n.anno) h += `<div class="note-card anno"><div class="path">📝 ${n.anno.path}</div>${esc(n.anno.excerpt)}</div>`;
  for (const i of n.inter) h += `<div class="note-card inter"><div class="path">🔗 ${i.path} · <code>${i.ref}</code></div>${esc(i.excerpt)}</div>`;
  h += `<div style="color:var(--accent);font-size:.82rem;cursor:pointer;margin-top:4px;">${n.anno ? "Open annotation" : "+ Annotate John 15:" + v}</div>`;
  return h;
}
function transStack(v) {
  return TRANSLATIONS.map(t =>
    `<div class="trans-row"><span class="tid">${t}</span>${esc(verseText(v, t))}</div>`).join("");
}
function banner() {
  if (state.bannerDismissed) return "";
  return `<div class="entry-banner">↳ Opened from <code>{John 15:4-7 web callout}</code> in <b>&nbsp;Sermons/2025-06-08 Fruitfulness.md</b> — verses 4–7 highlighted
    <button onclick="state.bannerDismissed=true;render()" title="Dismiss">✕</button></div>`;
}
function transChips() {
  return TRANSLATIONS.map(t =>
    `<button class="chip ${t === state.translation ? "active" : ""}" onclick="state.translation='${t}';render()">${t}</button>`).join(" ");
}
function seg(label, key, opts) {
  return `<span><span class="seg-label">${label}</span><span class="seg">${opts.map(([val, text]) =>
    `<button class="${state[key] === val ? "on" : ""}" onclick="state.${key}='${val}';render()">${text}</button>`).join("")}</span></span>`;
}
function clickVerse(v) {
  state.selected = v;
  if (state.details === "inline") {
    state.expanded.has(v) ? state.expanded.delete(v) : state.expanded.add(v);
  }
  render();
}

/* ---------------- pieces ---------------- */
function toolbar() {
  return `<div class="toolbar">
    ${seg("Details", "details", [["inline","Inline"],["side","Side panel"]])}
    ${seg("Nav", "nav", [["tree","Tree"],["crumb","Breadcrumb"]])}
    ${seg("Layout", "layout", [["line","Verse / line"],["continuous","Continuous"]])}
    <div class="spacer"></div>
    ${transChips()}
  </div>`;
}
function tree() {
  const chips = Array.from({ length: CHAPTERS }, (_, i) =>
    `<button class="tree-ch ${i === 14 ? "on" : ""}">${i + 1}</button>`).join("");
  return `<div class="tree">
    <div class="grp">New Testament</div>
    ${BOOKS_BEFORE.map(b=>`<button class="tree-book">${b}</button>`).join("")}
    <button class="tree-book on" onclick="state.bookOpen=!state.bookOpen;render()">${state.bookOpen ? "▾" : "▸"} John</button>
    ${state.bookOpen ? `<div class="tree-chapters">${chips}</div>` : ""}
    ${BOOKS_AFTER.map(b=>`<button class="tree-book">${b}</button>`).join("")}
  </div>`;
}
function crumb() {
  return `<div class="crumb">
    <button class="link">John</button> ›
    <button class="link">15</button>
    <span class="hint">(click to change)</span>
    <div class="spacer"></div>
    <button class="step">‹ John 14</button>
    <button class="step">John 16 ›</button>
  </div>`;
}
function expandBox(v) {
  return `<div class="expand">
    <div class="exp-title">John 15:${v} — other translations &amp; notes</div>
    <table>${TRANSLATIONS.filter(t => t !== state.translation).map(t =>
      `<tr><td>${t}</td><td>${esc(verseText(v, t))}</td></tr>`).join("")}</table>
    ${noteCards(v)}
  </div>`;
}
function versesLine() {
  const out = [];
  for (let v = 1; v <= VERSE_COUNT; v++) {
    const cls = ["v-line",
      v >= HIGHLIGHT.from && v <= HIGHLIGHT.to ? "hl" : "",
      state.details === "side" && v === state.selected ? "sel" : ""].join(" ");
    out.push(`<div class="${cls}" onclick="clickVerse(${v})">
      <span class="vnum">${v}</span>${esc(verseText(v))}<span class="marks">${marks(v)}</span></div>`);
    if (state.details === "inline" && state.expanded.has(v)) out.push(expandBox(v));
  }
  return out.join("");
}
function versesContinuous() {
  const paras = [];
  let current = [], pendingExpands = [];
  const flush = () => {
    if (current.length) paras.push(`<p>${current.join(" ")}</p>${pendingExpands.join("")}`);
    current = []; pendingExpands = [];
  };
  for (let v = 1; v <= VERSE_COUNT; v++) {
    if (PARAGRAPHS.includes(v) && v !== 1) flush();
    const cls = ["v-span",
      v >= HIGHLIGHT.from && v <= HIGHLIGHT.to ? "hl" : "",
      state.details === "side" && v === state.selected ? "sel" : ""].join(" ");
    current.push(`<span class="${cls}" onclick="clickVerse(${v})"><sup>${v}</sup>${esc(verseText(v))}<span class="marks">${marks(v)}</span></span>`);
    if (state.details === "inline" && state.expanded.has(v)) pendingExpands.push(expandBox(v));
  }
  flush();
  return `<div class="prose">${paras.join("")}</div>`;
}
function sidePanel() {
  const tab = state.sideTab;
  const n = NOTES[state.selected];
  const count = n ? (n.anno ? 1 : 0) + n.inter.length : 0;
  return `<div class="side">
    <div class="side-tabs">
      <button class="side-tab ${tab==="trans"?"on":""}" onclick="state.sideTab='trans';render()">Translations</button>
      <button class="side-tab ${tab==="notes"?"on":""}" onclick="state.sideTab='notes';render()">Notes ${count ? `<span class="badge">${count}</span>` : ""}</button>
    </div>
    <div class="side-body">
      <div style="font-size:.8rem;color:var(--faint);margin-bottom:6px;">John 15:${state.selected}</div>
      ${tab === "trans" ? transStack(state.selected) : noteCards(state.selected)}
    </div>
  </div>`;
}

/* ---------------- render ---------------- */
function render() {
  document.getElementById("app").innerHTML = `<div class="shell">
    ${banner()}
    ${toolbar()}
    ${state.nav === "crumb" ? crumb() : ""}
    <div class="main">
      ${state.nav === "tree" ? tree() : ""}
      <div class="content-col">
        <div class="scroll"><div class="inner">
          <h1>John 15 <span class="tid">· ${state.translation}</span></h1>
          ${state.layout === "line" ? versesLine() : versesContinuous()}
          <div class="attrib">${ATTRIB[state.translation]}</div>
        </div></div>
      </div>
      ${state.details === "side" ? sidePanel() : ""}
    </div>
  </div>`;
}
render();
</script>
</body>
</html>
